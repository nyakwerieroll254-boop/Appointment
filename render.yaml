services:
  - type: web
    name: eroll-appointments
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: appointment-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: /var/data/bookings.sqlite
      - key: ADMIN_API_TOKEN
        generateValue: true
      - key: SMTP_USER
        value: nyakwerieroll254@gmail.com
      - key: SMTP_PASS
        sync: false
      - key: PESAPAL_ENVIRONMENT
        value: sandbox
      - key: DARAJA_ENVIRONMENT
        value: sandbox
      - key: AFRICASTALKING_ENVIRONMENT
        value: sandbox
      - key: AFRICASTALKING_USERNAME
        sync: false
      - key: AFRICASTALKING_API_KEY
        sync: false
      - key: AFRICASTALKING_SENDER_ID
        sync: false
